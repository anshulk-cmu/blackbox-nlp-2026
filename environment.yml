# Conda environment for the BlackboxNLP 2026 paper pipeline.
#
# Build:  conda env create -f environment.yml -n blackbox
# Activate:  conda activate blackbox
# Validate:  python toy/run_toy.py    (should print "45 PASS / 0 FAIL")
#
# Pinned versions match what the toy was validated under and what Babel's
# CUDA toolchain supports. If you need to update PyTorch/CUDA, re-validate
# the toy before running any real-model phase.

name: blackbox
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.4
  - scipy=1.13.1
  - scikit-learn=1.5.2
  - pandas=2.2.2
  - pyarrow=17.0.0
  - matplotlib=3.9.2
  - tqdm=4.66.5
  # PyTorch + CUDA: pin against Babel's available CUDA. Adjust pytorch-cuda if
  # Babel's installed CUDA differs from 12.1.
  - pytorch=2.4.1
  - pytorch-cuda=12.1
  - pip:
      - transformers==4.45.0
      - huggingface_hub==0.25.1
      - accelerate==1.0.1
      - safetensors==0.4.5
